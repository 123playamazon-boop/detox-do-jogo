<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Detox do Jogo — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: mobile-first app shell — content column + bottom tab bar (mobile) / sidebar (desktop). Same design language as the Detox landing. */
:root{
  --bg:#061714; --bg2:#0D211D; --surface:#102923; --surface-2:#163A32; --line:rgba(180,214,205,.12);
  --hl:#35C9A0; --amber-border:#8D7624; --amber-bg:#292719;
  --fg:#EAF3F0; --muted:#92A8A2; --faint:#6A807A;
  --accent:#35D8A4; --accent-deep:#1FB184; --accent-soft:rgba(53,216,164,.12);
  --amber:#D7B63D; --amber-soft:rgba(242,178,61,.14);
  --radius-sm:10px; --radius:16px; --radius-lg:24px;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 20px 50px -20px rgba(0,0,0,.6);
  --maxw:720px;
  --font-display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.14;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
.tabnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* shell */
#app{min-height:100%;display:flex;flex-direction:column}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(11,24,22,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-deep));display:grid;place-items:center;flex:none}
.brand .dot svg{width:15px;height:15px}
.appbar .dayband{font-size:12.5px;color:var(--muted);font-family:var(--font-display);font-weight:600}
main{flex:1;width:100%;max-width:var(--maxw);margin:0 auto;padding:24px 20px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media(min-width:900px){
  #app{flex-direction:row}
  .sidebar{display:flex!important}
  .appbar{display:none}
  main{padding-bottom:40px;max-width:760px}
  .tabbar{display:none!important}
}

/* sidebar (desktop) */
.sidebar{display:none;flex-direction:column;gap:6px;width:240px;flex:none;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:6px 10px 18px}
.sidebar a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:14.5px;transition:background .15s,color .15s}
.sidebar a:hover{background:var(--surface);color:var(--fg)}
.sidebar a.active{background:var(--accent-soft);color:var(--accent)}
.sidebar a svg{width:19px;height:19px;flex:none}
.sidebar .emg{margin-top:12px;background:var(--amber-soft);color:var(--amber);border:1px solid rgba(242,178,61,.3)}
.sidebar .emg:hover{background:rgba(242,178,61,.2);color:var(--amber)}

/* bottom tab bar (mobile) */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(11,24,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10.5px;font-family:var(--font-display);font-weight:600;flex:1;padding:4px}
.tabbar a svg{width:21px;height:21px}
.tabbar a.active{color:var(--accent)}
.tabbar .emg{position:relative;top:-14px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);width:54px;height:54px;border-radius:50%;justify-content:center;gap:0;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);flex:none}
.tabbar .emg svg{width:22px;height:22px}
.tabbar .emg span{font-size:8px;line-height:1;margin-top:1px}

/* cards + bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card-2{background:var(--surface-2)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.h-xl{font-size:clamp(26px,6vw,34px);letter-spacing:-.02em}
.h-lg{font-size:22px;letter-spacing:-.01em}
.pbar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent-deep),var(--accent));transition:width .6s ease}
.row{display:flex;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .lab{font-size:12.5px;color:var(--muted)}
.stat .val{font-family:var(--font-display);font-weight:800;font-size:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:16px;border-radius:999px;padding:15px 24px;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;line-height:1;text-align:center;width:auto}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(145deg,var(--accent),var(--accent-deep));color:#042019;box-shadow:0 10px 28px -12px rgba(53,216,164,.6)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
.btn-full{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* inputs */
label.field{display:block;margin-bottom:16px}
label.field > span{display:block;font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:9px}
.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--fg);font-family:var(--font-body);font-size:16px;outline:none}
.input:focus,textarea.input:focus{border-color:var(--accent)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-size:15px;transition:border-color .15s,background .15s}
.opt:hover{border-color:rgba(180,214,205,.3)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--faint);flex:none;display:grid;place-items:center}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt .box svg{width:12px;height:12px;opacity:0;color:#042019}
.opt.sel .box svg{opacity:1}
.opt.radio .box{border-radius:50%}

/* chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.chip{font-family:var(--font-display);font-weight:600;font-size:15px;padding:13px 8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--fg);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* progress dots / calendar */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cal b{aspect-ratio:1;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--faint)}
.cal b.done{background:var(--accent-soft);color:var(--accent);border-color:rgba(53,216,164,.35)}
.cal b.now{background:var(--accent);color:#042019;border-color:var(--accent)}
.cal b.relapse{border-color:rgba(242,178,61,.5);color:var(--amber)}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach .a{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;opacity:.5}
.ach .a.on{opacity:1;border-color:rgba(53,216,164,.35)}
.ach .a .ic{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 8px;color:var(--faint)}
.ach .a.on .ic{background:var(--accent-soft);color:var(--accent)}
.ach .a .ic svg{width:17px;height:17px}
.ach .a b{font-family:var(--font-display);font-size:12.5px;display:block}

/* phase header */
.phasebar{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}

/* emergency fullscreen steps */
.emg-wrap{min-height:100%;display:flex;flex-direction:column}
.emg-step{display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center;padding:10px 0}
.breathe{width:120px;height:120px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;color:var(--amber);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.timer{font-family:var(--font-display);font-weight:800;font-size:40px;color:var(--amber)}
.stepdots{display:flex;gap:7px;justify-content:center}
.stepdots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.stepdots i.on{background:var(--amber)}

/* journal entries */
.entry{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:15px}
.entry .meta{font-size:12px;color:var(--faint);font-family:var(--font-display);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.entry .tag{color:var(--amber)}
.entry p{font-size:14px;color:var(--muted)}

/* materials */
.mat{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.mat .ic{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mat .ic svg{width:21px;height:21px}
.mat b{font-family:var(--font-display);font-weight:600;font-size:15px;display:block}
.mat small{color:var(--muted);font-size:12.5px}
.mat .badge{margin-left:auto;font-size:11px;color:var(--faint);background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:999px;flex:none}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--accent);color:var(--fg);padding:13px 20px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s,transform .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:900px){.toast{bottom:28px}}

.callout{display:flex;gap:12px;align-items:flex-start;background:var(--amber-soft);border:1px solid rgba(242,178,61,.25);border-radius:14px;padding:15px}
.callout svg{width:20px;height:20px;color:var(--amber);flex:none;margin-top:2px}
.callout p{font-size:13.5px;color:var(--fg)}
.callout b{color:var(--amber)}

.center{text-align:center;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.divider{height:1px;background:var(--line);margin:4px 0}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:14px;cursor:pointer;background:none;border:0;padding:0}
.back svg{width:16px;height:16px}
</style>
</head>
<body>
<div id="app"><!-- rendered by JS --></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DETOX DO JOGO — App (área logada) — MVP Etapa 2
   SPA com roteamento por hash + storageService abstraído.
   Mesma identidade visual da landing. Sem backend ainda.
   ============================================================ */

/* ---------- CONFIGURAÇÃO CENTRAL ---------- */
var CONFIG = {
  price: '39,99',
  LANDING_URL: 'https://detox-do-jogo.vercel.app',
  APP_URL: 'https://detox-do-jogo.vercel.app/app',   // success-url da Cakto = APP_URL + '#welcome'
  CHECKOUT_URL: 'https://pay.cakto.com.br/79g5kjy_1162574',
  metaPixelId: '',            // NEXT_PUBLIC_META_PIXEL_ID
  /* Purchase: separa SINAL client-side de CONFIRMAÇÃO real.
     false (padrão) = NÃO dispara o evento padrão 'Purchase' do Pixel só porque
     alguém abriu a tela de boas-vindas (a URL é pública e isso seria falso positivo).
     A confirmação REAL deve vir de webhook/CAPI da Cakto (ver confirmPurchase). */
  firePixelPurchaseClientSide: false
};
CONFIG.checkoutUrl = CONFIG.CHECKOUT_URL;

/* ===========================================================
   storageService — ÚNICO ponto de persistência.
   Troque o corpo de _load/_save por chamadas Supabase depois;
   a interface (getState/setState/update/journal) não muda.
   =========================================================== */
var Store = (function(){
  var KEY='detox_state_v1';
  var mem=null;
  function defaults(){
    return {
      profile:null,            // {name, goal, mainTrigger, win, dailyBet}
      onboarded:false,
      completedDays:[],        // [1,2,...]
      dayData:{},              // {1:{reflection, checklist:[], saved:true}}
      streak:0,                // sequência registrada separadamente da conclusão
      lastCompletedAt:null,
      lastCompletedDate:null,  // 'YYYY-M-D' local — controla a cadência diária
      relapses:[],             // [{at, before, trigger, feeling, different}]
      journal:[],              // [{at, mood, what, urge, did}]
      purchased:false,
      createdAt:new Date().toISOString()
    };
  }
  function _load(){
    if(mem) return mem;
    try{ var r=localStorage.getItem(KEY); mem=r?Object.assign(defaults(),JSON.parse(r)):defaults(); }
    catch(e){ mem=defaults(); }
    return mem;
  }
  function _save(s){ mem=s; try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  return {
    getState:function(){ return _load(); },
    setState:function(s){ _save(s); },
    update:function(fn){ var s=_load(); fn(s); _save(s); return s; },
    reset:function(){ _save(defaults()); }
  };
})();

/* ---------- ANALYTICS (privacy-safe) ---------- */
var Analytics=(function(){
  function sid(){ try{var k='dj_sid',v=sessionStorage.getItem(k);if(!v){v='sid_'+Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem(k,v);}return v;}catch(e){return 'sid_mem';} }
  function utm(){ var p;try{p=new URLSearchParams(location.search);}catch(e){p=null;} var g=function(k){return p?(p.get(k)||''):'';}; return {source:g('utm_source'),campaign:g('utm_campaign'),content:g('utm_content')}; }
  var SID=sid();
  function event(name,data){
    var u=utm();
    var payload={event_name:name,timestamp:new Date().toISOString(),session_id:SID,page:location.pathname+location.hash,source:u.source,campaign:u.campaign,content:u.content,data:data||{}};
    window.dataLayer=window.dataLayer||[];window.dataLayer.push(payload);
    if(!CONFIG.metaPixelId){try{console.debug('[analytics]',name,payload);}catch(e){}}
    return payload;
  }
  return {event:event};
})();
var Pixel=(function(){
  var ready=false;
  function load(id){ if(!id)return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    try{window.fbq('init',id);ready=true;}catch(e){}
  }
  return {load:load,track:function(n,d){if(ready&&window.fbq){try{window.fbq('track',n,d||{});}catch(e){}}}};
})();
/* NUNCA passa conteúdo privado (diário, gatilhos, valores individuais) para cá. */
function track(name,data){ Pixel.track(name,data); Analytics.event(name,data); }

/* ---------- CONFIRMED PURCHASE (arquitetura, ainda não acionado no client) ----------
   Ponto ÚNICO para a confirmação REAL de pagamento. Hoje não é chamado no navegador,
   para evitar falso positivo (qualquer um pode abrir a URL de boas-vindas).
   Futuro: um webhook server-side da Cakto confirma o pedido e dispara o Purchase
   padrão via Conversions API. Mantido aqui só para documentar a separação. */
window.confirmPurchase=function(order){ /* order = {id, value, currency} — ligar via backend/CAPI */ };

/* ---------- util ---------- */
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
function brl(n){return BRL.format(Math.round(n||0));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},2200);}
var CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>';
function checkSvg(sz){return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';}

/* ---------- 30 DIAS (conteúdo real, conciso: 5-10 min/dia) ---------- */
var PHASES=[
  {name:'Consciência',range:'Dias 1–7',from:1,to:7},
  {name:'Gatilhos',range:'Dias 8–14',from:8,to:14},
  {name:'Controle',range:'Dias 15–21',from:15,to:21},
  {name:'Consolidação',range:'Dias 22–30',from:22,to:30}
];
function phaseOf(d){for(var i=0;i<PHASES.length;i++){if(d>=PHASES[i].from&&d<=PHASES[i].to)return PHASES[i];}return PHASES[0];}
var DAYS=[
 {d:1,t:'Entenda o seu ponto de partida',o:'Enxergar como o seu comportamento de aposta funciona hoje.',w:'Antes de mudar um comportamento, precisamos enxergar como ele funciona. Hoje você só observa, sem se julgar.',m:'Responda, com calma, quanto costuma apostar, com que frequência e em quais situações. Depois defina seu objetivo para os 30 dias.',r:'O que mais te surpreendeu ao olhar para esses números?',c:['Informei meu valor médio','Marquei minhas situações','Defini meu objetivo']},
 {d:2,t:'Identifique seus gatilhos',o:'Mapear quando a vontade costuma aparecer.',w:'A vontade quase nunca vem do nada. Ela tem hora, lugar e emoção. Reconhecer o gatilho é o primeiro poder sobre ele.',m:'Liste as 3 situações, horários ou emoções que mais puxam você para apostar.',r:'Qual gatilho parece o mais forte hoje?',c:['Listei meus 3 principais gatilhos']},
 {d:3,t:'Dificulte o acesso',o:'Cortar o piloto automático colocando fricção no caminho.',w:'Quanto mais fácil apostar, mais a decisão acontece no automático. Hoje você aumenta a distância entre o impulso e a ação.',m:'Desinstale apps de aposta, saia de grupos de dicas, ative autoexclusão onde houver e remova cartões salvos.',r:'O que ficou mais difícil de fazer no impulso agora?',c:['Removi um acesso fácil hoje']},

function dayByNum(n){for(var i=0;i<DAYS.length;i++){if(DAYS[i].d===n)return DAYS[i];}return null;}

/* ---------- derivações de estado ---------- */
function currentDay(s){ for(var d=1;d<=30;d++){ if(s.completedDays.indexOf(d)<0) return d; } return 31; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function todayDone(s){ return s.completedDays.length>0 && s.lastCompletedDate===todayStr(); }
function moneyNotBet(s){ var bet=(s.profile&&s.profile.dailyBet)?s.profile.dailyBet:0; return bet*s.completedDays.length; }
function progressPct(s){ return Math.round((s.completedDays.length/30)*100); }
function isComplete(s){ return s.completedDays.length>=30; }

/* ---------- ONBOARDING ---------- */
var ONB_Q=[
  {k:'freq',q:'Com que frequência você costuma apostar?',type:'radio',opts:['Todo dia','Quase todo dia','Algumas vezes por semana','De vez em quando']},
  {k:'mainTrigger',q:'Qual situação mais desperta vontade de apostar?',type:'radio',opts:['Quando estou entediado','Depois de uma perda','Sozinho à noite','Sob estresse ou briga','Dia de pagamento','Vendo jogo ou esporte']},
  {k:'goal',q:'O que você mais quer recuperar neste momento?',type:'radio',opts:['Meu dinheiro','Meu tempo','Minha tranquilidade','Minha rotina','Minha relação com a família']},
  {k:'win',q:'Qual seria uma pequena vitória nos próximos 30 dias?',type:'text',placeholder:'Ex.: passar um fim de semana inteiro sem apostar'}
];
var onbState={i:0,answers:{},name:''};
function viewOnboarding(){
  if(!Store.getState().onboardingStarted){ Store.update(function(s){s.onboardingStarted=true;}); track('OnboardingStarted'); }
  renderOnbStep();
}
function renderOnbStep(){
  var total=ONB_Q.length+1; // +1 nome
  var step=onbState.i;
  var inner;
  if(step===0){
    inner='<label class="field"><span>Como podemos te chamar?</span><input class="input" id="onbName" value="'+esc(onbState.name)+'" placeholder="Seu primeiro nome" /></label>';
  } else {
    var q=ONB_Q[step-1];
    if(q.type==='radio'){
      var cur=onbState.answers[q.k];
      inner='<div style="font-family:var(--font-display);font-weight:600;font-size:18px;margin-bottom:16px">'+esc(q.q)+'</div><div class="opts">'+
        q.opts.map(function(o){return '<button class="opt radio '+(cur===o?'sel':'')+'" data-o="'+esc(o)+'"><span class="box">'+CK+'</span>'+esc(o)+'</button>';}).join('')+'</div>';
    } else {
      inner='<label class="field"><span>'+esc(q.q)+'</span><textarea class="input" id="onbText" placeholder="'+esc(q.placeholder||'')+'">'+esc(onbState.answers[q.k]||'')+'</textarea></label>';
    }
  }
  var pct=Math.round((step/total)*100);
  App.innerHTML='<main style="max-width:540px;margin:0 auto;padding:28px 20px;min-height:100%;display:flex;flex-direction:column;gap:22px">'+
    '<div class="pbar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div>'+
    '<div class="faint" style="font-size:12.5px;font-family:var(--font-display);font-weight:600">Passo '+(step+1)+' de '+total+'</div>'+
    '<div class="card" style="background:transparent;border:0;padding:0">'+inner+'</div>'+
    '<div class="row" style="margin-top:auto">'+
      (step>0?'<button class="btn btn-ghost" id="onbBack">Voltar</button>':'')+
      '<button class="btn btn-primary" id="onbNext" style="flex:1">'+(step===total-1?'Concluir':'Continuar')+'</button>'+
    '</div></main>';
  var nextBtn=document.getElementById('onbNext');
  function save(){
    if(step===0){ var n=document.getElementById('onbName'); onbState.name=n?n.value.trim():''; }
    else{ var q=ONB_Q[step-1]; if(q.type==='text'){ var t=document.getElementById('onbText'); onbState.answers[q.k]=t?t.value.trim():''; } }
  }
  if(step>0){ document.getElementById('onbBack').onclick=function(){ save(); onbState.i--; renderOnbStep(); }; }
  // radio clicks
  App.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ var q=ONB_Q[step-1]; onbState.answers[q.k]=b.getAttribute('data-o'); renderOnbStep(); }; });
  nextBtn.onclick=function(){
    save();
    if(step===0 && !onbState.name){ toast('Como podemos te chamar?'); return; }
    if(step>0){ var q=ONB_Q[step-1]; if(!onbState.answers[q.k]){ toast('Escolha uma opção para continuar'); return; } }
    if(step<total-1){ onbState.i++; renderOnbStep(); }
    else{
      Store.update(function(s){
        s.onboarded=true;
        s.profile=Object.assign({},s.profile,{name:onbState.name,goal:onbState.answers.goal,mainTrigger:onbState.answers.mainTrigger,freq:onbState.answers.freq,win:onbState.answers.win});
      });
      track('OnboardingCompleted'); // sem conteúdo sensível, só o evento
      go('home');
    }
  };
}

/* ---------- DAY VIEW ---------- */
function viewDay(route){
  var n=parseInt(route.split('-')[1],10);
  var s=Store.getState();
  if(!n||n<1||n>30){ go('home'); return; }
  var cd=currentDay(s);
  // portão de cadência diária: concluiu hoje → o próximo passo abre amanhã
  if(n===cd && todayDone(s) && s.completedDays.indexOf(n)<0){ shell(tomorrowScreen(n),route); return; }
  // future day lock
  if(n>cd && s.completedDays.indexOf(n)<0){
    shell('<button class="back" onclick="history.length>1?history.back():go(\'home\')">'+arrow()+'Voltar</button>'+
      '<div class="card center stack" style="margin-top:14px"><div style="width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin:0 auto;color:var(--faint)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><h2 class="h-lg">Dia '+n+' ainda está fechado</h2><p class="muted">Um passo de cada vez. Conclua o dia '+cd+' para abrir o próximo.</p><a class="btn btn-primary" href="#day-'+cd+'">Ir para o dia de hoje</a></div>',route);
    return;
  }
  var day=dayByNum(n);
  var ph=phaseOf(n);
  var completed=s.completedDays.indexOf(n)>=0;
  var saved=(s.dayData[n]&&s.dayData[n].reflection)||'';
  var checks=(s.dayData[n]&&s.dayData[n].checklist)||[];
  track('DayStarted',{day:n});

  var special = (n===1) ? daySpecial1(s) : '';
  var checklistHtml = day.c&&day.c.length ? '<div class="card"><div class="eyebrow">Checklist</div><div class="opts" id="dayChecks">'+
      day.c.map(function(c,i){var on=checks.indexOf(i)>=0;return '<button class="opt '+(on?'sel':'')+'" data-ci="'+i+'"><span class="box">'+CK+'</span>'+esc(c)+'</button>';}).join('')+'</div></div>' : '';

  var inner=
    '<button class="back" id="dayBack">'+arrow()+'Voltar</button>'+
    '<div style="margin-top:12px"><span class="phasebar">Fase '+(PHASES.indexOf(ph)+1)+' · '+ph.name+'</span></div>'+
    '<div><div class="eyebrow" style="margin:14px 0 4px">Dia '+n+'</div><h1 class="h-xl">'+esc(day.t)+'</h1></div>'+
    '<div class="card"><div class="eyebrow">Objetivo</div><p>'+esc(day.o)+'</p></div>'+
    '<div class="card card-2"><div class="eyebrow">Por que isso importa</div><p class="muted" style="font-size:14.5px">'+esc(day.w)+'</p></div>'+
    special+
    '<div class="card"><div class="eyebrow">Missão</div><p>'+esc(day.m)+'</p></div>'+
    checklistHtml+
    '<div class="card"><div class="eyebrow">Reflexão</div><p class="muted" style="font-size:14.5px;margin-bottom:12px">'+esc(day.r)+'</p><textarea class="input" id="dayRefl" placeholder="Escreva aqui (fica só com você)">'+esc(saved)+'</textarea></div>'+
    '<div class="row"><button class="btn btn-ghost" id="daySave">Salvar</button><button class="btn btn-primary" id="dayDone" style="flex:1">'+(completed?'Dia concluído ✓':'Concluir dia')+'</button></div>'+
    (completed?'':'<p class="faint center" style="font-size:12.5px">Concluir atualiza seu progresso e sua sequência.</p>');
  shell(inner,route);

  document.getElementById('dayBack').onclick=function(){ go('home'); };
  var checkState=checks.slice();
  App.querySelectorAll('#dayChecks .opt').forEach(function(b){
    b.onclick=function(){ var i=parseInt(b.getAttribute('data-ci'),10); var at=checkState.indexOf(i); if(at>=0){checkState.splice(at,1);b.classList.remove('sel');}else{checkState.push(i);b.classList.add('sel');} };
  });
  function persist(){ var refl=document.getElementById('dayRefl').value; Store.update(function(st){ st.dayData[n]=Object.assign({},st.dayData[n],{reflection:refl,checklist:checkState}); }); }
  document.getElementById('daySave').onclick=function(){ persist(); toast('Salvo'); };
  document.getElementById('dayDone').onclick=function(){
    persist();
    if(n===1 && !saveDay1Profile()) return;
    var already=Store.getState().completedDays.indexOf(n)>=0;
    if(!already){
      Store.update(function(st){
        st.completedDays.push(n); st.completedDays.sort(function(a,b){return a-b;});
        st.streak=st.streak+1; st.lastCompletedAt=new Date().toISOString(); st.lastCompletedDate=todayStr();
      });
      track('DayCompleted',{day:n});
      if(Store.getState().completedDays.length>=30){ track('ChallengeCompleted'); }
    }
    dayDoneScreen(n);
  };
}

/* ---------- EMERGENCY PROTOCOL ---------- */
var emg={i:0,trigger:'',timer:null,left:120};
var EMG_STEPS=[
  {k:'PAUSE',t:'Pause',d:'Respire. A vontade é uma onda — ela sobe e desce. Vamos esperar 2 minutos juntos.'},
  {k:'IDENTIFIQUE',t:'Identifique',d:'O que disparou a vontade agora? Nomear o gatilho já tira parte da força dele.'},
  {k:'ADIE',t:'Adie',d:'Você não precisa decidir para sempre. Só adiar. Que tal revisitar isso daqui a 1 hora?'},
  {k:'MUDE O CONTEXTO',t:'Mude o contexto',d:'Saia do lugar, mude de ambiente, faça uma das suas ações alternativas. Troque o cenário.'},
  {k:'REGISTRE',t:'Registre',d:'Guardar o que aconteceu transforma este momento em aprendizado para o próximo.'}
];
var EMG_TRIGGERS=['Tédio','Perda','Estresse','Pagamento','Sozinho','Bebida','Vendo jogo'];
function viewEmergency(){
  emg={i:0,trigger:'',timer:null,left:120};
  track('EmergencyProtocolStarted');
  renderEmgIntro();
}
function emgClose(){ if(emg.timer){clearInterval(emg.timer);emg.timer=null;} go('home'); }
function renderEmgIntro(){
  App.innerHTML='<main style="max-width:520px;margin:0 auto;padding:30px 20px;min-height:100%;display:flex;flex-direction:column;gap:22px">'+
   '<button class="back" id="emgX">'+arrow()+'Fechar</button>'+
   '<div class="emg-step" style="margin-top:20px"><div class="breathe"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2a7 7 0 0 0-7 7c0 3 2 5 2 8h10c0-3 2-5 2-8a7 7 0 0 0-7-7Z"/><path d="M9 21h6"/></svg></div>'+
   '<h1 class="h-xl">Vamos passar pelos próximos minutos juntos.</h1>'+
   '<p class="muted">Cinco passos curtos. Sem pressa, sem julgamento. Você está no controle.</p>'+
   '<button class="btn btn-amber btn-full" id="emgStart">Começar</button></div></main>';
  document.getElementById('emgX').onclick=emgClose;
  document.getElementById('emgStart').onclick=function(){ emg.i=0; renderEmgStep(); };
}
function renderEmgStep(){
  var st=EMG_STEPS[emg.i];
  var body='';
  if(emg.i===0){
    body='<div class="breathe"><span class="timer" id="emgTimer">2:00</span></div><p class="muted">Inspire... segure... solte. Deixe a onda passar.</p>';
  } else if(emg.i===1){
    body='<div class="chips" style="grid-template-columns:repeat(2,1fr);width:100%">'+EMG_TRIGGERS.map(function(t){return '<button class="chip '+(emg.trigger===t?'sel':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+'</div>';
  } else if(emg.i===2){
    body='<div class="timer" style="color:var(--accent)">1 hora</div><p class="muted">Adiar não é falhar. É dar tempo para a vontade baixar.</p>';
  } else if(emg.i===3){
    body='<div class="opts" style="width:100%;text-align:left"><div class="opt">Levantar e beber um copo de água</div><div class="opt">Sair para uma caminhada curta</div><div class="opt">Mandar mensagem para alguém de confiança</div></div>';
  } else {
    body='<p class="muted">Você passou pelo momento mais difícil. Quer registrar o que aconteceu?</p>';
  }
  App.innerHTML='<main style="max-width:520px;margin:0 auto;padding:30px 20px;min-height:100%;display:flex;flex-direction:column;gap:20px">'+
   '<button class="back" id="emgX">'+arrow()+'Fechar</button>'+
   '<div class="stepdots">'+EMG_STEPS.map(function(_,k){return '<i class="'+(k<=emg.i?'on':'')+'"></i>';}).join('')+'</div>'+
   '<div class="emg-step"><div class="eyebrow" style="margin:0">Passo '+(emg.i+1)+' de 5 · '+esc(st.k)+'</div>'+
   '<h1 class="h-xl">'+esc(st.t)+'</h1><p class="muted">'+esc(st.d)+'</p>'+body+'</div>'+
   '<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">'+
     '<button class="btn btn-amber btn-full" id="emgNext">'+(emg.i<4?'Próximo passo':'Finalizar')+'</button>'+
     (emg.i===0?'<p class="faint center" style="font-size:12px">Pode avançar quando sentir que a onda passou.</p>':'')+
   '</div></main>';
  document.getElementById('emgX').onclick=emgClose;
  if(emg.i===0){
    emg.left=120;var tEl=document.getElementById('emgTimer');
    if(emg.timer)clearInterval(emg.timer);
    emg.timer=setInterval(function(){emg.left--;var m=Math.floor(emg.left/60),s=emg.left%60;if(tEl)tEl.textContent=m+':'+(s<10?'0':'')+s;if(emg.left<=0){clearInterval(emg.timer);emg.timer=null;}},1000);
  } else if(emg.timer){clearInterval(emg.timer);emg.timer=null;}
  if(emg.i===1){ App.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){emg.trigger=c.getAttribute('data-t');App.querySelectorAll('.chip').forEach(function(x){x.classList.remove('sel');});c.classList.add('sel');};}); }
  document.getElementById('emgNext').onclick=function(){ if(emg.i<4){emg.i++;renderEmgStep();}else{renderEmgEnd();} };
}
function renderEmgEnd(){
  if(emg.timer){clearInterval(emg.timer);emg.timer=null;}
  track('EmergencyProtocolCompleted'); // não envia o gatilho (privado)
  App.innerHTML='<main style="max-width:520px;margin:0 auto;padding:30px 20px;min-height:100%;display:flex;flex-direction:column;gap:20px">'+
   '<div class="emg-step" style="margin-top:30px"><div style="width:64px;height:64px;border-radius:50%;background:var(--accent-soft);border:1px solid rgba(53,216,164,.3);display:grid;place-items:center;color:var(--accent)"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div>'+
   '<h1 class="h-xl">Você não precisa tomar uma decisão definitiva agora.</h1>'+
   '<p class="muted">Você passou pelos minutos mais difíceis. Isso é controle, não sorte.</p></div>'+
   '<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">'+
     '<button class="btn btn-primary btn-full" id="emgBack">Voltar para o desafio</button>'+
     '<button class="btn btn-ghost btn-full" id="emgReg">Registrar o que aconteceu</button>'+
   '</div></main>';
  document.getElementById('emgBack').onclick=function(){go('home');};
  document.getElementById('emgReg').onclick=function(){go('relapse');};
}

   RELAPSE_Q.map(function(q){return '<label class="field"><span>'+esc(q.q)+'</span><textarea class="input" data-k="'+q.k+'" placeholder="'+esc(q.ph)+'"></textarea></label>';}).join('')+
   '<button class="btn btn-primary btn-full" id="relSave">Retomar meu Detox</button>'+
   '<div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 0-7 7c0 3 2 5 2 8h10c0-3 2-5 2-8a7 7 0 0 0-7-7ZM9 21h6"/></svg><p>Se as recaídas estão frequentes ou pesadas, procurar ajuda é um sinal de força. <b>CVV 188</b>, Jogadores Anônimos e os CAPS oferecem apoio gratuito.</p></div>';
  shell(inner,'home');
  document.getElementById('relBack').onclick=function(){go('home');};
  document.getElementById('relSave').onclick=function(){
    var rec={at:new Date().toISOString()};
    App.querySelectorAll('[data-k]').forEach(function(t){rec[t.getAttribute('data-k')]=t.value;});
    Store.update(function(s){ s.relapses.push(rec); s.streak=0; }); // sequência reinicia; dias concluídos permanecem
    track('RelapseRegistered'); // nunca envia o conteúdo
    toast('Registrado. Seu progresso continua.');
    go('home');
  };
}

/* ---------- JOURNAL ---------- */
function viewJournal(route){
  var s=Store.getState();
  var list=s.journal.slice().reverse();
  var inner=
   '<div><div class="eyebrow">Meu diário</div><h1 class="h-xl">Como foi o seu dia?</h1></div>'+
   '<div class="card stack">'+
     '<label class="field" style="margin:0"><span>Como estou me sentindo?</span><input class="input" id="jMood" placeholder="Em uma palavra ou frase"/></label>'+
     '<label class="field" style="margin:0"><span>O que aconteceu?</span><textarea class="input" id="jWhat" placeholder="O que marcou o seu dia"></textarea></label>'+
     '<label class="field" style="margin:0"><span>Tive vontade de apostar?</span><div class="opts" id="jUrge"><button class="opt radio" data-u="Não">Não</button><button class="opt radio" data-u="Um pouco">Um pouco</button><button class="opt radio" data-u="Muito">Muito</button></div></label>'+
     '<label class="field" style="margin:0"><span>O que eu fiz?</span><textarea class="input" id="jDid" placeholder="Como você lidou com o dia"></textarea></label>'+
     '<button class="btn btn-primary btn-full" id="jSave">Salvar entrada</button>'+
   '</div>'+
   '<p class="faint" style="font-size:12px;text-align:center">Suas anotações ficam só no seu aparelho e nunca são enviadas para análise.</p>'+
   (list.length?'<div class="divider"></div><div class="eyebrow">Entradas anteriores</div>':'')+
   '<div class="stack">'+list.map(function(e){
      var dt=new Date(e.at);var ds=dt.toLocaleDateString('pt-BR')+' · '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      return '<div class="entry"><div class="meta"><span>'+esc(ds)+'</span>'+(e.urge&&e.urge!=='Não'?'<span class="tag">vontade: '+esc(e.urge)+'</span>':'')+'</div>'+(e.mood?'<p style="color:var(--fg)">'+esc(e.mood)+'</p>':'')+(e.what?'<p>'+esc(e.what)+'</p>':'')+(e.did?'<p>'+esc(e.did)+'</p>':'')+'</div>';
   }).join('')+'</div>';
  shell(inner,route);
  var urge='';
  App.querySelectorAll('#jUrge .opt').forEach(function(b){b.onclick=function(){urge=b.getAttribute('data-u');App.querySelectorAll('#jUrge .opt').forEach(function(x){x.classList.remove('sel');});b.classList.add('sel');};});
  document.getElementById('jSave').onclick=function(){
    var mood=document.getElementById('jMood').value.trim();
    var what=document.getElementById('jWhat').value.trim();
    var did=document.getElementById('jDid').value.trim();
    if(!mood&&!what&&!did){toast('Escreva algo para salvar');return;}
    Store.update(function(st){st.journal.push({at:new Date().toISOString(),mood:mood,what:what,urge:urge,did:did});});
    track('JournalEntryCreated'); // conteúdo nunca é enviado
    toast('Entrada salva');
    viewJournal(route);
  };
}

/* ---------- TRIGGERS MAP ---------- */
function viewTriggers(route){
  var s=Store.getState();
  // agrega gatilhos do onboarding + dia 1 + recaídas (tudo local/privado)
  var counts={};
  function add(t){if(!t)return;counts[t]=(counts[t]||0)+1;}
  if(s.profile){ add(s.profile.mainTrigger); (s.profile.situations||[]).forEach(add); }
  s.relapses.forEach(function(r){add(r.trigger);});
  var arr=Object.keys(counts).map(function(k){return {k:k,v:counts[k]};}).sort(function(a,b){return b.v-a.v;});
  var max=arr.length?arr[0].v:1;
  var inner=
   '<div><div class="eyebrow">Meus gatilhos</div><h1 class="h-xl">O que dispara a vontade</h1><p class="muted" style="margin-top:10px">Construído a partir do que você registrou. Quanto mais você usa o app, mais preciso fica.</p></div>'+
   (arr.length?'<div class="card stack">'+arr.map(function(g){var pct=Math.round(g.v/max*100);return '<div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>'+esc(g.k)+'</span><span style="color:var(--accent);font-family:var(--font-display);font-weight:600">'+g.v+'x</span></div><div class="pbar"><i style="width:'+pct+'%"></i></div></div>';}).join('')+'</div>'+
     '<div class="card card-2"><p style="font-size:14px">Seu gatilho mais forte agora: <b style="color:var(--accent)">'+esc(arr[0].k)+'</b>. Nos próximos dias, dê atenção extra às missões que falam sobre ele.</p></div>'
     :'<div class="card center"><p class="muted">Seus gatilhos vão aparecer aqui conforme você avança no desafio e usa o protocolo de emergência.</p></div>')+
   '<p class="faint" style="font-size:12px;text-align:center">Estes dados são privados e ficam só no seu aparelho.</p>';
  shell(inner,route);
}

/* ---------- PROGRESS ---------- */
function viewProgress(route){
  var s=Store.getState();
  var done=s.completedDays.length;
  var relDays=[]; // marca dias de recaída aproximando por índice (ilustrativo: nenhum por padrão)
  var cells='';
  var cd=currentDay(s);
  for(var d=1;d<=30;d++){
    var cls=s.completedDays.indexOf(d)>=0?'done':(d===cd&&!isComplete(s)?'now':'');
    cells+='<b class="'+cls+'">'+(d<10?'0'+d:d)+'</b>';
  }
  var ach=[
    {n:1,label:'Primeiro dia'},{n:3,label:'3 dias'},{n:7,label:'7 dias'},
    {n:14,label:'14 dias'},{n:21,label:'21 dias'},{n:30,label:'30 dias'}
  ];
  var star='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18l-5.8 3 1.1-6.5L2.6 9.8l6.5-.9L12 3Z"/></svg>';
  var inner=
   '<div><div class="eyebrow">Meu progresso</div><h1 class="h-xl">Sua jornada até aqui</h1></div>'+
   '<div class="grid2">'+
     '<div class="card stat"><span class="lab">Dias concluídos</span><span class="val">'+done+'/30</span></div>'+
     '<div class="card stat"><span class="lab">Sequência atual</span><span class="val">'+s.streak+(s.streak===1?' dia':' dias')+'</span></div>'+
     '<div class="card stat"><span class="lab">Progresso</span><span class="val">'+progressPct(s)+'%</span></div>'+
     '<div class="card stat"><span class="lab">Não apostado</span><span class="val money">'+brl(moneyNotBet(s))+'</span></div>'+
   '</div>'+
   '<div class="card"><div class="eyebrow">Calendário dos 30 dias</div><div class="cal">'+cells+'</div></div>'+
   '<div class="card"><div class="eyebrow">Conquistas</div><div class="ach">'+ach.map(function(a){var on=done>=a.n;return '<div class="a '+(on?'on':'')+'"><div class="ic">'+star+'</div><b>'+a.label+'</b></div>';}).join('')+'</div></div>'+
   (s.relapses.length?'<div class="card card-2"><div class="eyebrow">Registros</div><p class="muted" style="font-size:14px">Você registrou '+s.relapses.length+' recaída(s) — e seguiu em frente. Isso faz parte. Seus dias concluídos continuam contando.</p></div>':'');
  shell(inner,route);
}

   '<p class="faint" style="font-size:12px;text-align:center;margin-top:4px">Materiais imprimíveis. Para preencher no papel ou salvar no celular.</p>';

/* ===========================================================
   ROUTER
   =========================================================== */
function render(){
  var s=Store.getState();
  var hash=(location.hash||'').replace(/^#/,'');
  if(!hash) hash = s.onboarded ? 'home' : (s.purchased ? 'onboarding' : 'welcome');

  // guardas de fluxo
  if(hash!=='welcome' && hash!=='onboarding' && !s.onboarded){
    // ainda não terminou onboarding → manda para o começo certo
    hash = s.purchased ? 'onboarding' : 'welcome';
    if((location.hash||'').replace(/^#/,'')!==hash){ location.replace('#'+hash); }
  }

  window.scrollTo(0,0);
  if(hash==='welcome') return viewWelcome();
  if(hash==='onboarding') return viewOnboarding();
  if(hash==='home') return viewHome(hash);
  if(hash.indexOf('day-')===0){ viewDay(hash); if(hash==='day-1') bindDay1(); return; }
  if(hash==='emergency') return viewEmergency();
  if(hash==='relapse') return viewRelapse();
  if(hash==='journal') return viewJournal(hash);
  if(hash==='triggers') return viewTriggers(hash);
  if(hash==='progress') return viewProgress(hash);
  if(hash==='materials') return viewMaterials(hash);
  return viewHome('home');
}
window.addEventListener('hashchange',render);

/* ---------- boot ---------- */
(function(){
  Pixel.load(CONFIG.metaPixelId);
  track('PageView');
  render();
})();
</script>
